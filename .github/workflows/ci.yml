name: Clinical score and static app verification

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]"
          python -m pip check
      - name: Compile Python
        run: python -m compileall -q gibleed_sentinel.py agents gi_bleed_urgent_triage_agent
      - name: Pytest
        run: python -m pytest -q
      - name: Check browser JS and boundary tests
        run: |
          node --check web/app.js
          node --test web/app.test.cjs
      - name: CLI smoke test
        run: |
          gi-bleed-urgent-triage-engine gbs --bun 4 --hemoglobin 15 --sex male --sbp 125 --heart-rate 70 --history-confirmed
      - name: API startup and audit checks
        run: |
          python -c "from agents.clinical_api import app; assert app is not None"
          python -c "from agents.base import AuditTrail; a=AuditTrail(secret_key='0123456789abcdef'); a.log('system','test','check',{'ok':True}); assert a.verify_integrity()"
