[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gi-bleed-urgent-triage-engine"
version = "2.1.0"
description = "Deterministic upper GI bleeding risk score calculators"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Medical Science Apps",
]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
gi-bleed-urgent-triage-engine = "gibleed_sentinel:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/gi-bleed-urgent-triage-agent"
Repository = "https://github.com/abusuraihsakhri/gi-bleed-urgent-triage-agent"

[tool.setuptools]
py-modules = ["gibleed_sentinel", "enrichment", "simulator", "cli"]

[tool.setuptools.packages.find]
include = ["agents*", "gi_bleed_urgent_triage_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_gibleed_sentinel.py"]
